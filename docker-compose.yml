# EdgeCloudInspection/docker-compose.yml
version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: inspeccion_server_dev
    ports:
      - "8000:8000"
    volumes:
      # Sincroniza la carpeta local 'server' con '/app' en el contenedor (Live Reload)
      - ./server:/app
    environment:
      # Fuerza a watchfiles a usar polling (útil en Windows/WSL2 con Docker Desktop)
      - WATCHFILES_FORCE_POLLING=true
    # Comando con --reload para habilitar el developer watch de FastAPI
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload